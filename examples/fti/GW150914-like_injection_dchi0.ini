################################################################################
## Data generation arguments
################################################################################

trigger-time=1126259462.4083128
gaussian-noise=False
zero-noise=True

################################################################################
## Detector arguments
################################################################################

detectors=['H1', 'L1', 'V1']
duration=8.0
generation-seed=42
maximum-frequency=896
minimum-frequency=20
tukey-roll-off=1.0

################################################################################
## Injection arguments
################################################################################

injection=True
injection-dict={'chirp_mass': 31.080507255711808, 'mass_ratio': 0.9791372124185734, 'chi_1': -0.057016286519525075, 'chi_2': 0.0008440647243846901, 'luminosity_distance': 508.4801358265931, 'dec': -1.2596594761427808, 'ra': 2.0626964189897876, 'theta_jn': 2.731912716127884, 'psi': 1.8482291039257048, 'phase': 2.037591879872884, 'geocent_time': 1126259462.4083128,}
injection-waveform-approximant=SEOBNRv5HM_ROM
injection-frequency-domain-source-model=lal_binary_black_hole

################################################################################
## Job submission arguments
################################################################################

accounting=ligo.dev.o4.cbc.testgr.tiger
accounting-user=elise.sanger
label=GW150914-like_injection_dchi0
local=False
local-generation=False
outdir=outdir
request-disk=5.0
request-memory=32.0
request-cpus=16
transfer-files=True
additional-transfer-paths=[osdf:///igwn/shared/auxiliary/obs_sci/cbc/waveform/lalsimulation_data/SEOBNRv5HMROM_v1.0.hdf5]
environment-variables={'HDF5_USE_FILE_LOCKING': False, 'OMP_NUM_THREADS': 1, 'OMP_PROC_BIND': False, 'LAL_DATA_PATH': '/cvmfs/shared.storage.igwn.org/igwn/shared/auxiliary/obs_sci/cbc/waveform/lalsimulation_data'}
osg=False

################################################################################
## Likelihood arguments
################################################################################

calibration-marginalization=False
distance-marginalization=True
distance-marginalization-lookup-table=None
phase-marginalization=False
time-marginalization=False
reference-frame=H1L1
time-reference=H1
likelihood-type=GravitationalWaveTransient

################################################################################
## Prior arguments
################################################################################

prior-file=None
prior-dict = {
   chirp_mass = bilby.gw.prior.UniformInComponentsChirpMass(name='chirp_mass', minimum=25, maximum=35, unit=r'$M_{\odot}$'),
   mass_ratio = bilby.gw.prior.UniformInComponentsMassRatio(name='mass_ratio', minimum=0.05, maximum=1.0),
   mass_1 = Constraint(name='mass_1', minimum=1, maximum=1000),
   mass_2 = Constraint(name='mass_2', minimum=1, maximum=1000),
   chi_1 = bilby.gw.prior.AlignedSpin(name='chi_1', a_prior=Uniform(minimum=0.0, maximum=0.99)),
   chi_2 = bilby.gw.prior.AlignedSpin(name='chi_2', a_prior=Uniform(minimum=0.0, maximum=0.99)),
   luminosity_distance =  bilby.gw.prior.UniformSourceFrame(name='luminosity_distance', cosmology=Planck15, maximum=1000, minimum=1, unit='Mpc'),
   dec = Cosine(name='dec'),
   ra = Uniform(name='ra', minimum=0, maximum=2*np.pi, boundary='periodic'),
   theta_jn = Sine(name='theta_jn'),
   psi = Uniform(name='psi', minimum=0, maximum=np.pi, boundary='periodic'),
   phase = Uniform(name='phase', minimum=0, maximum=2*np.pi, boundary='periodic'),
   dchi_0 = Uniform(name='dchi_0',  minimum=-20, maximum=20 ),
   f_window_div_f_peak = DeltaFunction(name='f_window_div_f_peak', peak=1.0 ),
   NumCycles = DeltaFunction(name='NumCycles', peak=1.0 )
}

################################################################################
## Sampler arguments
################################################################################

sampler=dynesty
n-parallel=2
sampler-kwargs={'nlive': 1000, 'naccept': 60, 'check_point_plot': True, 'check_point_delta_t': 1800, 'print_method': 'interval-60', 'sample': 'acceptance-walk', 'npool': 16}

################################################################################
## Waveform arguments
################################################################################

reference-frequency=20.0
waveform-approximant=SEOBNRv5HM_ROM
frequency-domain-source-model=bilby_tgr.fti.source.lal_binary_black_hole
conversion-function=bilby_tgr.fti.conversion.convert_to_lal_binary_black_hole_parameters
generation-function=bilby_tgr.fti.conversion.generate_all_bbh_parameters