[build-system]
requires = [
    "setuptools>=42",
    "setuptools_scm[toml]>=3.4.3",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "bilby_tgr"
description = "Testing GR analysis pipelines to use with Bilby"
authors = [
        {name = "Michalis Agathos"},
        {name = "Gregory Ashton"},
        {name = "Tomasz Baka"},
        {name = "Geraint Pratten"},
        {name = "Elise Sänger"},
        {name = "Colm Talbot"},
        {name = "Aditya Vijaykumar"},
        {name = "Balazs Cirok"},
        {name = "Raffi Enficiaud"},
        {name = "Abhirup Ghosh"},
        {name = "Haris K"},
        {name = "Shasvath Kapadia"},
        {name = "Krishnendu N V"},
        {name = "Elisa Maggio"},
        {name = "Ajit Mehta"},
        {name = "Tsun-Ho Pang"},
        {name = "Lorenzo Pompili"},
        {name = "Soumen Roy"},
        {name = "Jan Steinhoff"},
        {name = "Avinash Tiwari"},
        {name = "Naresh Adhikari"},
        {name = "Stanislav Babak"},
        {name = "Gregorio Carullo"},
        {name = "Shrobana Ghosh"},
        {name = "Anuradha Gupta"},
        {name = "Ish Gupta"},
        {name = "Leila Haegel"},
        {name = "Maria Haney"},
        {name = "Danny Laghi"},
        {name = "Samson Leong"},
        {name = "Alex Nielsen"},
        {name = "Abhishek Sharma"},
        {name = "Sergio Vallejo-P"},
        {name = "Mick Wright"},
        ]
maintainers = [
        {name = "Elise Sänger", email = "elise.sanger@ligo.org"},
        {name = "Michalis Agathos", email = "michalis.agathos@ligo.org"},
        ]
readme = "README.rst"
requires-python = ">=3.8"
license = { text = "MIT" }
version = "0.2"
dependencies = [
    "bilby",
    "lalsuite>=7.25",
    "numpy>=1.17",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
repository = "https://git.ligo.org/lscsoft/bilby_tgr"

[project.optional-dependencies]
automation = ["cbcflow>=0.2.2", "asimov>=0.5.0b11"]

[tool.setuptools]
packages = ["bilby_tgr",
            "bilby_tgr.fti",
            "bilby_tgr.mdr",
            "bilby_tgr.pseob",
            "bilby_tgr.siqm",
            "bilby_tgr.ssb",
            "bilby_tgr.tiger",
]

[tool.setuptools_scm]
write_to = "bilby_tgr/_version.py"

[project.entry-points.'asimov.pipelines']
bilbymdr = 'bilby_tgr.mdr.asimov.bilbyMDR:BilbyMDR'

[project.entry-points.'asimov.hooks.postmonitor']
tgrflow = 'bilby_tgr.asimov.tgrflow:Collector'

[project.entry-points.'asimov.hooks.applicator']
tgrflow = 'bilby_tgr.asimov.tgrflow:Applicator'
mdrflow = 'bilby_tgr.mdr.asimov.mdrflow:Applicator'


